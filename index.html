<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Árbol de Navidad 3D</title>
<meta property="og:type" content="website">
<meta property="og:url" content="https://cesarhp1.github.io/arbol-navidad/">
<meta property="og:title" content="🎁 ¡Tienes un regalo de Navidad!">
<meta property="og:description" content="Toca aquí para abrir tu árbol 3D con nieve y música ✨🎄">
<meta property="og:image" content="https://cesarhp1.github.io/arbol-navidad/regalo.jpg">
<style>
:root{--bg:#050814;--hint-fg:rgba(255,255,255,.9);--hint-bg:rgba(10,18,37,.52)}
html,body{margin:0;padding:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:var(--bg);user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;touch-action:none}
#hint{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
color:var(--hint-fg);font:13.5px/1.35 system-ui,-apple-system,sans-serif;pointer-events:none;letter-spacing:.3px;
background:var(--hint-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:9px 18px;border-radius:22px;
border:1px solid rgba(255,255,255,.15);box-shadow:0 8px 24px rgba(0,0,0,.3);transition:opacity 1s ease-out;text-align:center;
max-width:calc(100vw - 28px);white-space:normal;z-index:8}
#btnLights{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));
cursor:pointer;color:var(--hint-fg);font:13px/1 system-ui,-apple-system,sans-serif;letter-spacing:.3px;
background:var(--hint-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:9px 15px;border-radius:20px;
border:1px solid rgba(255,255,255,.16);box-shadow:0 6px 20px rgba(0,0,0,.3);transition:transform .15s ease,background .2s ease,border-color .2s ease;
z-index:12;-webkit-tap-highlight-color:transparent;white-space:nowrap}
#btnLights:hover{background:rgba(24,38,74,.7);border-color:rgba(255,255,255,.34);transform:translateY(-1px)}
#btnLights:active{transform:scale(.96)}
#loader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
background:radial-gradient(circle at 50% 42%,#101c3d 0%,#050814 75%);color:#fff;font-family:system-ui,-apple-system,sans-serif;
transition:opacity .7s ease}
#loader.hide{opacity:0;pointer-events:none}
.ld-star{width:54px;height:54px;filter:drop-shadow(0 0 18px rgba(255,215,90,.85));animation:ldPulse 1.3s ease-in-out infinite}
.ld-txt{font-size:14.5px;letter-spacing:.6px;color:rgba(255,255,255,.9);text-align:center;padding:0 20px}
.ld-bar{width:min(220px,62vw);height:5px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;box-shadow:0 0 12px rgba(0,0,0,.4)}
.ld-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#ffd65c,#fff3b8,#66d9ff);animation:ldLoad 2.3s cubic-bezier(.22,.61,.36,1) forwards}
@keyframes ldPulse{0%,100%{transform:scale(1) rotate(0deg);opacity:.9}50%{transform:scale(1.12) rotate(8deg);opacity:1}}
@keyframes ldLoad{0%{width:8%}60%{width:78%}100%{width:100%}}
@media (max-width:600px){
  #hint{font-size:12px;padding:8px 14px;bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  #btnLights{font-size:12px;padding:8px 13px}
}
</style>
</head>
<body>
<div id="loader" aria-label="Cargando escena navideña">
  <svg class="ld-star" viewBox="0 0 64 64" fill="none">
    <path d="M32 4L39.6 21.8L58.8 23.6L44.2 36.2L48.6 55L32 45L15.4 55L19.8 36.2L5.2 23.6L24.4 21.8L32 4Z" fill="#ffd95a"/>
  </svg>
  <div class="ld-txt">Preparando tu Navidad...</div>
  <div class="ld-bar"><div class="ld-fill"></div></div>
</div>
<button id="btnLights" type="button">✨ Luces: Clásico</button>
<div id="hint">🖱️ Arrastra para rotar · Zoom · Toca adornos, regalos, estrella o muñeco · 🎵 Toca para música</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(()=>{
const loadStart=performance.now(),loaderEl=document.getElementById('loader');
const MUSIC_FILE="navidad.mp3";
const bgm=new Audio(MUSIC_FILE);bgm.loop=true;bgm.preload='auto';bgm.volume=0;
let musicStarted=false;
function startMusicOnce(){
  if(musicStarted)return;musicStarted=true;
  bgm.play().then(()=>{
    const fade=setInterval(()=>{if(bgm.volume<.44)bgm.volume=Math.min(.45,bgm.volume+.03);else clearInterval(fade);},80);
  }).catch(()=>{musicStarted=false;});
}
['pointerdown','pointerup','click'].forEach(ev=>addEventListener(ev,startMusicOnce,{passive:true}));

THREE.ColorManagement.legacyMode=false;
const rnd=(a=0,b=1)=>a+Math.random()*(b-a), PI2=Math.PI*2;
const getFov=()=>{const a=innerWidth/innerHeight;return a<1?Math.min(62,45/Math.pow(a,.42)):45;};

/* ===== ESCENA ===== */
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050814);
scene.fog=new THREE.FogExp2(0x050814,0.0145);
const camera=new THREE.PerspectiveCamera(getFov(),innerWidth/innerHeight,.1,300);
if(innerWidth<innerHeight)camera.position.set(13.5,9.6,18.5);
else camera.position.set(12,9,16);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;renderer.physicallyCorrectLights=true;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;
document.body.appendChild(renderer.domElement);

const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.05;
controls.target.set(0,5.1,0);controls.minDistance=7.5;controls.maxDistance=33;
controls.maxPolarAngle=Math.PI/2-.02;controls.autoRotate=true;controls.autoRotateSpeed=.4;
controls.addEventListener('start',()=>controls.autoRotate=false);

/* ===== ENTORNO ===== */
(()=>{const c=document.createElement('canvas');c.width=512;c.height=256;
const x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,256);
g.addColorStop(0,'#3a4c6e');g.addColorStop(.5,'#0a1225');g.addColorStop(1,'#1a1a2a');
x.fillStyle=g;x.fillRect(0,0,512,256);
const t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;t.encoding=THREE.sRGBEncoding;
const p=new THREE.PMREMGenerator(renderer);scene.environment=p.fromEquirectangular(t).texture;p.dispose();})();

/* ===== LUCES ===== */
scene.add(new THREE.AmbientLight(0x3a4a6e,.6));
const moon=new THREE.DirectionalLight(0xc8d8ff,1.2);
moon.position.set(-12,18,10);moon.castShadow=true;moon.shadow.mapSize.set(2048,2048);
Object.assign(moon.shadow.camera,{left:-16,right:16,top:16,bottom:-16,near:1,far:50});
moon.shadow.bias=-.0006;moon.shadow.normalBias=.03;scene.add(moon);
const warmFill=new THREE.PointLight(0xff8844,.8,25,2);warmFill.position.set(0,2,4);scene.add(warmFill);

/* ===== SUELO ===== */
const snowMat=new THREE.MeshStandardMaterial({color:0xdde8ff,roughness:.95});
const gGeo=new THREE.PlaneGeometry(160,160,110,110),gp=gGeo.attributes.position;
function groundH(wx,wz){
  const yPlane=-wz,k=Math.min(1,Math.max(0,(Math.hypot(wx,yPlane)-6)/10));
  return k*k*(Math.sin(wx*.28)*Math.cos(yPlane*.24)*.4+Math.sin(wx*.09+yPlane*.12)*.8+.3);
}
for(let i=0;i<gp.count;i++){
  const x=gp.getX(i),y=gp.getY(i),k=Math.min(1,Math.max(0,(Math.hypot(x,y)-6)/10));
  gp.setZ(i,k*k*(Math.sin(x*.28)*Math.cos(y*.24)*.4+Math.sin(x*.09+y*.12)*.8+.3));
}
gGeo.computeVertexNormals();
const ground=new THREE.Mesh(gGeo,snowMat);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

/* ===== TEXTURAS PROCEDURALES ===== */
const glowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=128;
const x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);
g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.2,'rgba(255,255,255,.75)');
g.addColorStop(.5,'rgba(255,255,255,.22)');g.addColorStop(1,'rgba(255,255,255,0)');
x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);})();

const flareTex=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
for(let a=0;a<2;a++){x.save();x.translate(64,64);x.rotate(a*Math.PI/2);
const g=x.createLinearGradient(-64,0,64,0);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.45,'rgba(255,255,255,.55)');
g.addColorStop(.5,'rgba(255,255,255,1)');g.addColorStop(.55,'rgba(255,255,255,.55)');g.addColorStop(1,'rgba(255,255,255,0)');
x.fillStyle=g;x.fillRect(-64,-3,128,6);x.restore();}
const rg=x.createRadialGradient(64,64,0,64,64,28);rg.addColorStop(0,'rgba(255,255,255,1)');rg.addColorStop(1,'rgba(255,255,255,0)');
x.fillStyle=rg;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);})();

const flakeTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;
const x=c.getContext('2d');x.translate(32,32);x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=2;x.lineCap='round';
for(let i=0;i<6;i++){x.save();x.rotate(i*Math.PI/3);x.beginPath();x.moveTo(0,0);x.lineTo(0,-24);x.stroke();
x.beginPath();x.moveTo(-6,-14);x.lineTo(0,-19);x.lineTo(6,-14);x.stroke();x.restore();}
return new THREE.CanvasTexture(c);})();

const baubleTextures=(()=>{
  const make=fn=>{const c=document.createElement('canvas');c.width=256;c.height=128;
    const x=c.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,256,128);fn(x);
    const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;};
  return[null,make(x=>{x.fillStyle='rgba(255,245,205,.85)';for(let y=28;y<=100;y+=24)x.fillRect(0,y,256,6);}),
    make(x=>{x.fillStyle='rgba(255,255,255,.95)';for(let i=0;i<28;i++){x.beginPath();x.arc((i*37)%256,20+((i*53)%88),4+(i%3),0,PI2);x.fill();}})];
})();

const woodTex=(()=>{const c=document.createElement('canvas');c.width=256;c.height=256;const x=c.getContext('2d');
x.fillStyle='#4a2f1d';x.fillRect(0,0,256,256);
for(let row=0;row<8;row++){const y=row*32,g=x.createLinearGradient(0,y,0,y+32);
g.addColorStop(0,'#26140a');g.addColorStop(.2,'#5c3b24');g.addColorStop(.55,'#6b452c');g.addColorStop(.92,'#3c2415');g.addColorStop(1,'#1b0e07');
x.fillStyle=g;x.fillRect(0,y,256,32);x.strokeStyle='rgba(20,10,4,.22)';
for(let k=0;k<5;k++){x.beginPath();x.moveTo(0,y+5+k*5);x.bezierCurveTo(85,y+3+k*5,170,y+7+k*5,256,y+5+k*5);x.stroke();}}
const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,2);t.encoding=THREE.sRGBEncoding;return t;})();

const stoneTex=(()=>{const c=document.createElement('canvas');c.width=256;c.height=256;const x=c.getContext('2d');
x.fillStyle='#2a2d34';x.fillRect(0,0,256,256);
for(let r=0;r<10;r++)for(let k=0;k<7;k++){const px=(k*38+(r%2)*18)%256,py=r*26,v=54+((r*17+k*31)%34);
x.fillStyle=`rgb(${v},${v+2},${v+7})`;x.fillRect(px,py,33,22);x.strokeStyle='#181a1f';x.lineWidth=2;x.strokeRect(px,py,33,22);}
const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1.5,2.5);t.encoding=THREE.sRGBEncoding;return t;})();

const winTex=(()=>{const c=document.createElement('canvas');c.width=128;c.height=128;const x=c.getContext('2d');
const g=x.createRadialGradient(64,74,8,64,64,78);g.addColorStop(0,'#fff3c4');g.addColorStop(.5,'#ffbe5c');g.addColorStop(1,'#a85214');
x.fillStyle=g;x.fillRect(0,0,128,128);x.fillStyle='rgba(55,22,8,.38)';
x.beginPath();x.moveTo(0,0);x.lineTo(42,0);x.quadraticCurveTo(22,55,0,90);x.closePath();x.fill();
x.beginPath();x.moveTo(128,0);x.lineTo(86,0);x.quadraticCurveTo(106,55,128,90);x.closePath();x.fill();
const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;})();

/* ===== LUNA Y AURORA ===== */
const moonDir=moon.position.clone().normalize();
const moonMesh=new THREE.Mesh(new THREE.SphereGeometry(2.6,24,24),new THREE.MeshBasicMaterial({color:0xfff6dd,fog:false}));
moonMesh.position.copy(moonDir).multiplyScalar(92);scene.add(moonMesh);
const moonHalo=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0xaec8ff,transparent:true,opacity:.48,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
moonHalo.position.copy(moonMesh.position);moonHalo.scale.set(22,22,1);scene.add(moonHalo);

const auroraUniforms={uTime:{value:0}};
const auroraGeo=new THREE.PlaneGeometry(140,26,80,12),ap=auroraGeo.attributes.position;
for(let i=0;i<ap.count;i++){const x=ap.getX(i),y=ap.getY(i),arc=x*.018;ap.setZ(i,Math.sin(x*.06)*8-Math.cos(arc)*18);ap.setY(i,y+Math.sin(x*.04)*2.5);}
auroraGeo.computeVertexNormals();
const aurora=new THREE.Mesh(auroraGeo,new THREE.ShaderMaterial({
  uniforms:auroraUniforms,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,fog:false,
  vertexShader:`varying vec2 vUv;uniform float uTime;void main(){vUv=uv;vec3 p=position;p.z+=sin(p.x*.08+uTime*.35)*2.2;p.y+=cos(p.x*.06-uTime*.25)*1.1;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);}`,
  fragmentShader:`varying vec2 vUv;uniform float uTime;void main(){float w1=sin(vUv.x*14.0+uTime*.45)*.5+.5;float w2=sin(vUv.x*23.0-uTime*.3+1.4)*.5+.5;float c=pow(w1*.65+w2*.35,1.6);float vf=smoothstep(0.,.28,vUv.y)*smoothstep(1.,.18,vUv.y);float hf=smoothstep(0.,.15,vUv.x)*smoothstep(1.,.85,vUv.x);vec3 col=mix(vec3(.08,.85,.55),vec3(.38,.35,.95),smoothstep(.25,.9,vUv.y)+w2*.25);gl_FragColor=vec4(col,c*vf*hf*.26);}`
}));
aurora.position.set(10,36,-62);aurora.rotation.y=-.25;scene.add(aurora);

/* ===== ÁRBOL CENTRAL ===== */
const tree=new THREE.Group();scene.add(tree);
const H=9.8,R=3.35,Y0=2;
const sOf=y=>Math.min(1,Math.max(0,(y-Y0)/(H-Y0)));
const prof=y=>{const s=sOf(y);return R*Math.pow(1-s,.8)*(1+.1*Math.sin(Math.PI*Math.min(1,s*1.3)))*(1+.17*Math.sin(y*4.4+.6)*(1-s*.6))+.1;};
const droop=y=>THREE.MathUtils.lerp(.5,.06,Math.pow(sOf(y),.8));
const envR=y=>{if(y<.25||y>H+.3)return 0;let y0=Math.max(y,Y0);for(let k=0;k<2;k++)y0=Math.min(H,Math.max(Y0,y+droop(y0)*prof(y0)));return prof(y0)*.95+.05;};

const skirt=new THREE.Mesh(new THREE.CylinderGeometry(1.45,1.6,.04,36),new THREE.MeshStandardMaterial({color:0x7b1122,roughness:.85}));
skirt.position.y=.02;skirt.receiveShadow=true;tree.add(skirt);
const skirtTrim=new THREE.Mesh(new THREE.TorusGeometry(1.52,.035,10,48),new THREE.MeshStandardMaterial({color:0xe0b84c,metalness:.75,roughness:.3}));
skirtTrim.rotation.x=Math.PI/2;skirtTrim.position.y=.035;tree.add(skirtTrim);

const stand=new THREE.Mesh(new THREE.CylinderGeometry(.75,.9,.55,24),new THREE.MeshStandardMaterial({color:0x8a1c1c,roughness:.5,metalness:.2}));
stand.position.y=.27;stand.castShadow=stand.receiveShadow=true;tree.add(stand);
const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.3,.45,2.4,16),new THREE.MeshStandardMaterial({color:0x3a2210,roughness:.95}));
trunk.position.y=1.2;trunk.castShadow=true;tree.add(trunk);

const cp=[];for(let i=0;i<=14;i++){const y=Y0-.3+(H-Y0+.5)*i/14;cp.push(new THREE.Vector2(i===14?0:R*.55*Math.pow(1-sOf(y),.85)+.05,y));}
const core=new THREE.Mesh(new THREE.LatheGeometry(cp,20),new THREE.MeshStandardMaterial({color:0x0b2a14,roughness:1,side:THREE.DoubleSide}));
core.castShadow=true;tree.add(core);

const needleGeo=new THREE.ConeGeometry(.15,1,5,1);needleGeo.translate(0,.5,0);
const foliage=new THREE.InstancedMesh(needleGeo,new THREE.MeshStandardMaterial({roughness:.9,flatShading:true}),14000);
const caps=new THREE.InstancedMesh(new THREE.SphereGeometry(1,8,6),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.9}),3500);
foliage.frustumCulled=caps.frustumCulled=false;foliage.castShadow=foliage.receiveShadow=true;caps.receiveShadow=true;
const dm=new THREE.Object3D(),UP=new THREE.Vector3(0,1,0),cl=new THREE.Color();
let nf=0,nc=0;
function twig(p,dir,len,w,shade){
  dm.position.copy(p);dm.quaternion.setFromUnitVectors(UP,dir.clone().normalize());
  dm.scale.set(w,len,w);dm.updateMatrix();foliage.setMatrixAt(nf,dm.matrix);
  cl.setHSL(rnd(.32,.38),rnd(.5,.72),shade);foliage.setColorAt(nf++,cl);
}
const tips=[],capP=[];let ang0=0;
for(let y0=Y0+.2;y0<H-.5;y0+=.34){
  const rb=prof(y0),nb=Math.max(4,Math.round(rb*3.6)),rise=THREE.MathUtils.lerp(.08,.28,sOf(y0)),dr=rise+droop(y0);ang0+=2.399;
  for(let b=0;b<nb;b++){
    if(Math.random()<.07)continue;
    const a=ang0+b/nb*PI2+rnd(-.3,.3),rh=rb*(1+.12*Math.sin(a*2+y0*.9)+.08*Math.sin(a*3-y0*1.7+1))*rnd(.8,1.08),cx=Math.cos(a),sz=Math.sin(a);
    const pt=u=>new THREE.Vector3(cx*rh*u,y0+rh*(rise*u-dr*u*u),sz*rh*u);
    const m=11;
    for(let j=1;j<=m;j++){
      const u=j/m,p=pt(u),tan=pt(u+.05).sub(pt(u-.05)).normalize(),sh=.1+.1*u+rnd(0,.05);
      const d0=tan.clone();d0.y-=.2;twig(p,d0,(1.05-.45*u)*rnd(.8,1.1)+.2,1,sh);
      for(const s of[-1,1]){const d=tan.clone().applyAxisAngle(UP,s*rnd(.5,1.1));d.y-=rnd(.15,.45);twig(p,d,rnd(.5,.8),.9,sh+rnd(0,.03));}
      if(u>.3&&Math.random()<.5&&nc<3500){capP.push(p.x,p.y+.08,p.z,rnd(.15,.26),rnd(.15,.26),rnd(.004,.012));nc++;}
      if(j===m)tips.push({p:p.clone(),a,rh,y0});
    }
  }
}
for(let i=0;i<12;i++)twig(new THREE.Vector3(0,H-1.4,0),new THREE.Vector3(rnd(-.3,.3)+.12,1,rnd(-.3,.3)),rnd(1.1,1.7),.9,.18);
foliage.count=nf;foliage.instanceColor.needsUpdate=true;foliage.instanceMatrix.needsUpdate=true;caps.count=nc;
const updCaps=st=>{for(let i=0;i<nc;i++){const q=i*6,f=.45+1.2*(1-Math.exp(-st*capP[q+5])),w=.7+.3*f;dm.position.set(capP[q],capP[q+1],capP[q+2]);dm.quaternion.identity();dm.scale.set(capP[q+3]*w,.05*f,capP[q+4]*w);dm.updateMatrix();caps.setMatrixAt(i,dm.matrix);}caps.instanceMatrix.needsUpdate=true;};
updCaps(0);tree.add(foliage,caps);

/* ===== GUIRNALDA + LUCES ===== */
const gp2=[],N=280,turns=7;
for(let i=0;i<=N;i++){const f=i/N,y0=Y0+.5+f*(H-Y0-1.5),a=f*turns*PI2,r=prof(y0)*.97+.05;gp2.push(new THREE.Vector3(Math.cos(a)*r,y0-droop(y0)*r+Math.sin(a*8)*.06,Math.sin(a)*r));}
tree.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(gp2),420,.025,5),new THREE.MeshStandardMaterial({color:0xe8c15a,metalness:.8,roughness:.35})));
const bulbCols=[0xff2a2a,0x2a7fff,0xffdd00,0x22ff66,0xff66dd,0xffaa00],bulbs=[],bulbGeo=new THREE.SphereGeometry(.09,10,10);

  const fx=(x+SZ/2)/SW,fz=(z+SZ/2)/SW;if(fx<0||fz<0||fx>=SG||fz>=SG)return groundH(x,z);
