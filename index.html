<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Árbol de Navidad 3D</title>
<style>
:root{--bg:#050814;--hint-fg:rgba(255,255,255,.9);--hint-bg:rgba(10,18,37,.52)}
html,body{margin:0;padding:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:var(--bg);user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;touch-action:none}
#hint{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
color:var(--hint-fg);font:13.5px/1.35 system-ui,-apple-system,sans-serif;pointer-events:none;letter-spacing:.3px;
background:var(--hint-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:9px 18px;border-radius:22px;
border:1px solid rgba(255,255,255,.15);box-shadow:0 8px 24px rgba(0,0,0,.3);transition:opacity 1s ease-out;text-align:center;
max-width:calc(100vw - 28px);white-space:normal;z-index:8}
#btnLights{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));
cursor:pointer;color:var(--hint-fg);font:13px/1 system-ui,-apple-system,sans-serif;letter-spacing:.3px;
background:var(--hint-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:9px 15px;border-radius:20px;
border:1px solid rgba(255,255,255,.16);box-shadow:0 6px 20px rgba(0,0,0,.3);transition:transform .15s ease,background .2s ease,border-color .2s ease;
z-index:12;-webkit-tap-highlight-color:transparent;white-space:nowrap}
#btnLights:hover{background:rgba(24,38,74,.7);border-color:rgba(255,255,255,.34);transform:translateY(-1px)}
#btnLights:active{transform:scale(.96)}
@media (max-width:600px){
  #hint{font-size:12px;padding:8px 14px;bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  #btnLights{font-size:12px;padding:8px 13px}
}
</style>
</head>
<body>
<button id="btnLights" type="button">✨ Luces: Clásico</button>
<div id="hint">🖱️ Arrastra para rotar · Zoom · Toca adornos, regalos, estrella o muñeco</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(()=>{
// ============================================================================
// 🎵 MÚSICA EN TU REPOSITORIO DE GITHUB
// Sube tu archivo MP3 junto a este index.html con el nombre "navidad.mp3"
// (o cambia el nombre aquí abajo). Sonará en bucle al primer toque/clic.
// ============================================================================
const MUSIC_FILE = "navidad.mp3";

const bgm=new Audio(MUSIC_FILE);
bgm.loop=true;
bgm.preload='auto';
bgm.volume=0;
let musicStarted=false;
function startMusicOnce(){
  if(musicStarted)return;
  musicStarted=true;
  bgm.play().then(()=>{
    const fade=setInterval(()=>{
      if(bgm.volume<.44)bgm.volume=Math.min(.45,bgm.volume+.03);
      else clearInterval(fade);
    },80);
  }).catch(()=>{musicStarted=false;});
}
addEventListener('pointerdown',startMusicOnce,{passive:true});

THREE.ColorManagement.legacyMode=false;
const rnd=(a=0,b=1)=>a+Math.random()*(b-a), PI2=Math.PI*2;

/* ===== CONFIGURACIÓN RESPONSIVA (MÓVIL Y PC) ===== */
const getFov=()=>{const a=innerWidth/innerHeight;return a<1?Math.min(62,45/Math.pow(a,.42)):45;};

/* ===== ESCENA ===== */
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050814);
scene.fog=new THREE.FogExp2(0x050814,0.0145);
const camera=new THREE.PerspectiveCamera(getFov(),innerWidth/innerHeight,.1,300);
if(innerWidth<innerHeight)camera.position.set(13.5,9.6,18.5);
else camera.position.set(12,9,16);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.physicallyCorrectLights=true;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
document.body.appendChild(renderer.domElement);

const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.05;
controls.target.set(0,5.1,0);
controls.minDistance=7.5;controls.maxDistance=33;
controls.maxPolarAngle=Math.PI/2-.02;
controls.autoRotate=true;controls.autoRotateSpeed=.4;
controls.addEventListener('start',()=>controls.autoRotate=false);

/* ===== ENTORNO (reflejos) ===== */
(()=>{const c=document.createElement('canvas');c.width=512;c.height=256;
const x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,256);
g.addColorStop(0,'#3a4c6e');g.addColorStop(.5,'#0a1225');g.addColorStop(1,'#1a1a2a');
x.fillStyle=g;x.fillRect(0,0,512,256);
const t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;t.encoding=THREE.sRGBEncoding;
const p=new THREE.PMREMGenerator(renderer);scene.environment=p.fromEquirectangular(t).texture;p.dispose();})();

/* ===== LUCES ===== */
scene.add(new THREE.AmbientLight(0x3a4a6e,.6));
const moon=new THREE.DirectionalLight(0xc8d8ff,1.2);
moon.position.set(-12,18,10);moon.castShadow=true;
moon.shadow.mapSize.set(2048,2048);
Object.assign(moon.shadow.camera,{left:-16,right:16,top:16,bottom:-16,near:1,far:50});
moon.shadow.bias=-.0006;moon.shadow.normalBias=.03;
scene.add(moon);
const warmFill=new THREE.PointLight(0xff8844,.8,25,2);warmFill.position.set(0,2,4);scene.add(warmFill);

/* ===== SUELO (con relieve suave) ===== */
const snowMat=new THREE.MeshStandardMaterial({color:0xdde8ff,roughness:.95});
const gGeo=new THREE.PlaneGeometry(160,160,110,110),gp=gGeo.attributes.position;
function groundH(wx,wz){
  const yPlane=-wz,k=Math.min(1,Math.max(0,(Math.hypot(wx,yPlane)-6)/10));
  return k*k*(Math.sin(wx*.28)*Math.cos(yPlane*.24)*.4+Math.sin(wx*.09+yPlane*.12)*.8+.3);
}
for(let i=0;i<gp.count;i++){
  const x=gp.getX(i),y=gp.getY(i),k=Math.min(1,Math.max(0,(Math.hypot(x,y)-6)/10));
  gp.setZ(i,k*k*(Math.sin(x*.28)*Math.cos(y*.24)*.4+Math.sin(x*.09+y*.12)*.8+.3));
}
gGeo.computeVertexNormals();
const ground=new THREE.Mesh(gGeo,snowMat);
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

/* ===== TEXTURAS PROCEDURALES ===== */
const glowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=128;
const x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);
g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.2,'rgba(255,255,255,.75)');
g.addColorStop(.5,'rgba(255,255,255,.22)');g.addColorStop(1,'rgba(255,255,255,0)');
x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);})();

const flareTex=(()=>{const c=document.createElement('canvas');c.width=c.height=128;
const x=c.getContext('2d');
for(let a=0;a<2;a++){
  x.save();x.translate(64,64);x.rotate(a*Math.PI/2);
  const g=x.createLinearGradient(-64,0,64,0);
  g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.45,'rgba(255,255,255,.55)');
  g.addColorStop(.5,'rgba(255,255,255,1)');g.addColorStop(.55,'rgba(255,255,255,.55)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(-64,-3,128,6);x.restore();
}
const rg=x.createRadialGradient(64,64,0,64,64,28);
rg.addColorStop(0,'rgba(255,255,255,1)');rg.addColorStop(1,'rgba(255,255,255,0)');
x.fillStyle=rg;x.fillRect(0,0,128,128);
return new THREE.CanvasTexture(c);})();

const flakeTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;
const x=c.getContext('2d');x.translate(32,32);x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=2;x.lineCap='round';
for(let i=0;i<6;i++){
  x.save();x.rotate(i*Math.PI/3);
  x.beginPath();x.moveTo(0,0);x.lineTo(0,-24);x.stroke();
  x.beginPath();x.moveTo(-6,-14);x.lineTo(0,-19);x.lineTo(6,-14);x.stroke();
  x.restore();
}
return new THREE.CanvasTexture(c);})();

const baubleTextures=(()=>{
  const make=fn=>{const c=document.createElement('canvas');c.width=256;c.height=128;
    const x=c.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,256,128);fn(x);
    const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;};
  return [
    null,
    make(x=>{x.fillStyle='rgba(255,245,205,.85)';for(let y=28;y<=100;y+=24)x.fillRect(0,y,256,6);}),
    make(x=>{x.fillStyle='rgba(255,255,255,.95)';for(let i=0;i<28;i++){x.beginPath();x.arc((i*37)%256,20+((i*53)%88),4+(i%3),0,PI2);x.fill();}})
  ];
})();

const woodTex=(()=>{
  const c=document.createElement('canvas');c.width=256;c.height=256;const x=c.getContext('2d');
  x.fillStyle='#4a2f1d';x.fillRect(0,0,256,256);
  for(let row=0;row<8;row++){
    const y=row*32,g=x.createLinearGradient(0,y,0,y+32);
    g.addColorStop(0,'#26140a');g.addColorStop(.2,'#5c3b24');g.addColorStop(.55,'#6b452c');g.addColorStop(.92,'#3c2415');g.addColorStop(1,'#1b0e07');
    x.fillStyle=g;x.fillRect(0,y,256,32);
    x.strokeStyle='rgba(20,10,4,.22)';
    for(let k=0;k<5;k++){x.beginPath();x.moveTo(0,y+5+k*5);x.bezierCurveTo(85,y+3+k*5,170,y+7+k*5,256,y+5+k*5);x.stroke();}
  }
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,2);t.encoding=THREE.sRGBEncoding;return t;
})();

const stoneTex=(()=>{
  const c=document.createElement('canvas');c.width=256;c.height=256;const x=c.getContext('2d');
  x.fillStyle='#2a2d34';x.fillRect(0,0,256,256);
  for(let r=0;r<10;r++)for(let k=0;k<7;k++){
    const px=(k*38+(r%2)*18)%256,py=r*26,v=54+((r*17+k*31)%34);
    x.fillStyle=`rgb(${v},${v+2},${v+7})`;x.fillRect(px,py,33,22);
    x.strokeStyle='#181a1f';x.lineWidth=2;x.strokeRect(px,py,33,22);
  }
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1.5,2.5);t.encoding=THREE.sRGBEncoding;return t;
})();

const winTex=(()=>{
  const c=document.createElement('canvas');c.width=128;c.height=128;const x=c.getContext('2d');
  const g=x.createRadialGradient(64,74,8,64,64,78);
  g.addColorStop(0,'#fff3c4');g.addColorStop(.5,'#ffbe5c');g.addColorStop(1,'#a85214');
  x.fillStyle=g;x.fillRect(0,0,128,128);
  x.fillStyle='rgba(55,22,8,.38)';
  x.beginPath();x.moveTo(0,0);x.lineTo(42,0);x.quadraticCurveTo(22,55,0,90);x.closePath();x.fill();
  x.beginPath();x.moveTo(128,0);x.lineTo(86,0);x.quadraticCurveTo(106,55,128,90);x.closePath();x.fill();
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;
})();

/* ===== LUNA Y AURORA BOREAL ===== */
const moonDir=moon.position.clone().normalize();
const moonMesh=new THREE.Mesh(
  new THREE.SphereGeometry(2.6,24,24),
  new THREE.MeshBasicMaterial({color:0xfff6dd,fog:false})
);
moonMesh.position.copy(moonDir).multiplyScalar(92);
scene.add(moonMesh);
const moonHalo=new THREE.Sprite(new THREE.SpriteMaterial({
  map:glowTex,color:0xaec8ff,transparent:true,opacity:.48,blending:THREE.AdditiveBlending,depthWrite:false,fog:false
}));
moonHalo.position.copy(moonMesh.position);moonHalo.scale.set(22,22,1);scene.add(moonHalo);

const auroraUniforms={uTime:{value:0}};
const auroraGeo=new THREE.PlaneGeometry(140,26,80,12);
const ap=auroraGeo.attributes.position;
for(let i=0;i<ap.count;i++){
  const x=ap.getX(i),y=ap.getY(i),arc=x*.018;
  ap.setZ(i,Math.sin(x*.06)*8-Math.cos(arc)*18);
  ap.setY(i,y+Math.sin(x*.04)*2.5);
}
auroraGeo.computeVertexNormals();
const aurora=new THREE.Mesh(auroraGeo,new THREE.ShaderMaterial({
  uniforms:auroraUniforms,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,fog:false,
  vertexShader:`varying vec2 vUv;uniform float uTime;void main(){vUv=uv;vec3 p=position;p.z+=sin(p.x*.08+uTime*.35)*2.2;p.y+=cos(p.x*.06-uTime*.25)*1.1;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);}`,
  fragmentShader:`varying vec2 vUv;uniform float uTime;void main(){float w1=sin(vUv.x*14.0+uTime*.45)*.5+.5;float w2=sin(vUv.x*23.0-uTime*.3+1.4)*.5+.5;float c=pow(w1*.65+w2*.35,1.6);float vf=smoothstep(0.,.28,vUv.y)*smoothstep(1.,.18,vUv.y);float hf=smoothstep(0.,.15,vUv.x)*smoothstep(1.,.85,vUv.x);vec3 col=mix(vec3(.08,.85,.55),vec3(.38,.35,.95),smoothstep(.25,.9,vUv.y)+w2*.25);gl_FragColor=vec4(col,c*vf*hf*.26);}`
}));
aurora.position.set(10,36,-62);aurora.rotation.y=-.25;scene.add(aurora);

/* ===== ÁRBOL CENTRAL ===== */
const tree=new THREE.Group();scene.add(tree);
const H=9.8,R=3.35,Y0=2;
const sOf=y=>Math.min(1,Math.max(0,(y-Y0)/(H-Y0)));
const prof=y=>{const s=sOf(y);return R*Math.pow(1-s,.8)*(1+.1*Math.sin(Math.PI*Math.min(1,s*1.3)))*(1+.17*Math.sin(y*4.4+.6)*(1-s*.6))+.1;};
const droop=y=>THREE.MathUtils.lerp(.5,.06,Math.pow(sOf(y),.8));
const envR=y=>{if(y<.25||y>H+.3)return 0;let y0=Math.max(y,Y0);for(let k=0;k<2;k++)y0=Math.min(H,Math.max(Y0,y+droop(y0)*prof(y0)));return prof(y0)*.95+.05;};

const skirt=new THREE.Mesh(new THREE.CylinderGeometry(1.45,1.6,.04,36),new THREE.MeshStandardMaterial({color:0x7b1122,roughness:.85}));
skirt.position.y=.02;skirt.receiveShadow=true;tree.add(skirt);
const skirtTrim=new THREE.Mesh(new THREE.TorusGeometry(1.52,.035,10,48),new THREE.MeshStandardMaterial({color:0xe0b84c,metalness:.75,roughness:.3}));
skirtTrim.rotation.x=Math.PI/2;skirtTrim.position.y=.035;tree.add(skirtTrim);

const stand=new THREE.Mesh(new THREE.CylinderGeometry(.75,.9,.55,24),
  new THREE.MeshStandardMaterial({color:0x8a1c1c,roughness:.5,metalness:.2}));
stand.position.y=.27;stand.castShadow=stand.receiveShadow=true;tree.add(stand);
const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.3,.45,2.4,16),
  new THREE.MeshStandardMaterial({color:0x3a2210,roughness:.95}));
trunk.position.y=1.2;trunk.castShadow=true;tree.add(trunk);

const cp=[];for(let i=0;i<=14;i++){const y=Y0-.3+(H-Y0+.5)*i/14;cp.push(new THREE.Vector2(i===14?0:R*.55*Math.pow(1-sOf(y),.85)+.05,y));}
const core=new THREE.Mesh(new THREE.LatheGeometry(cp,20),
  new THREE.MeshStandardMaterial({color:0x0b2a14,roughness:1,side:THREE.DoubleSide}));
core.castShadow=true;tree.add(core);

const needleGeo=new THREE.ConeGeometry(.15,1,5,1);needleGeo.translate(0,.5,0);
const foliage=new THREE.InstancedMesh(needleGeo,new THREE.MeshStandardMaterial({roughness:.9,flatShading:true}),14000);
const caps=new THREE.InstancedMesh(new THREE.SphereGeometry(1,8,6),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.9}),3500);
foliage.frustumCulled=caps.frustumCulled=false;
foliage.castShadow=foliage.receiveShadow=true;caps.receiveShadow=true;
const dm=new THREE.Object3D(),UP=new THREE.Vector3(0,1,0),cl=new THREE.Color();
let nf=0,nc=0;
function twig(p,dir,len,w,shade){
  dm.position.copy(p);dm.quaternion.setFromUnitVectors(UP,dir.clone().normalize());
  dm.scale.set(w,len,w);dm.updateMatrix();foliage.setMatrixAt(nf,dm.matrix);
  cl.setHSL(rnd(.32,.38),rnd(.5,.72),shade);foliage.setColorAt(nf++,cl);
}
const tips=[],capP=[];let ang0=0;
for(let y0=Y0+.2;y0<H-.5;y0+=.34){
  const rb=prof(y0),nb=Math.max(4,Math.round(rb*3.6)),rise=THREE.MathUtils.lerp(.08,.28,sOf(y0)),dr=rise+droop(y0);ang0+=2.399;
  for(let b=0;b<nb;b++){
    if(Math.random()<.07)continue;
    const a=ang0+b/nb*PI2+rnd(-.3,.3),rh=rb*(1+.12*Math.sin(a*2+y0*.9)+.08*Math.sin(a*3-y0*1.7+1))*rnd(.8,1.08),cx=Math.cos(a),sz=Math.sin(a);
    const pt=u=>new THREE.Vector3(cx*rh*u,y0+rh*(rise*u-dr*u*u),sz*rh*u);
    const m=11;
    for(let j=1;j<=m;j++){
      const u=j/m,p=pt(u),tan=pt(u+.05).sub(pt(u-.05)).normalize(),sh=.1+.1*u+rnd(0,.05);
      const d0=tan.clone();d0.y-=.2;
      twig(p,d0,(1.05-.45*u)*rnd(.8,1.1)+.2,1,sh);
      for(const s of[-1,1]){
        const d=tan.clone().applyAxisAngle(UP,s*rnd(.5,1.1));d.y-=rnd(.15,.45);
        twig(p,d,rnd(.5,.8),.9,sh+rnd(0,.03));
      }
      if(u>.3&&Math.random()<.5&&nc<3500){
        capP.push(p.x,p.y+.08,p.z,rnd(.15,.26),rnd(.15,.26),rnd(.004,.012));nc++;
        
      }
      if(j===m)tips.push({p:p.clone(),a,rh,y0});
    }
  }
}
for(let i=0;i<12;i++)twig(new THREE.Vector3(0,H-1.4,0),new THREE.Vector3(rnd(-.3,.3)+.12,1,rnd(-.3,.3)),rnd(1.1,1.7),.9,.18);
foliage.count=nf;foliage.instanceColor.needsUpdate=true;foliage.instanceMatrix.needsUpdate=true;
caps.count=nc;
const updCaps=st=>{for(let i=0;i<nc;i++){const q=i*6,f=.45+1.2*(1-Math.exp(-st*capP[q+5])),w=.7+.3*f;dm.position.set(capP[q],capP[q+1],capP[q+2]);dm.quaternion.identity();dm.scale.set(capP[q+3]*w,.05*f,capP[q+4]*w);dm.updateMatrix();caps.setMatrixAt(i,dm.matrix);}caps.instanceMatrix.needsUpdate=true;};
updCaps(0);
tree.add(foliage,caps);

/* ===== GUIRNALDA + LUCES ===== */
const gp2=[],N=280,turns=7;
for(let i=0;i<=N;i++){
  const f=i/N,y0=Y0+.5+f*(H-Y0-1.5),a=f*turns*PI2,r=prof(y0)*.97+.05;
  gp2.push(new THREE.Vector3(Math.cos(a)*r,y0-droop(y0)*r+Math.sin(a*8)*.06,Math.sin(a)*r));
}
tree.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(gp2),420,.025,5),
  new THREE.MeshStandardMaterial({color:0xe8c15a,metalness:.8,roughness:.35})));
const bulbCols=[0xff2a2a,0x2a7fff,0xffdd00,0x22ff66,0xff66dd,0xffaa00],bulbs=[],bulbGeo=new THREE.SphereGeometry(.09,10,10);
for(let i=2,idx=0;i<gp2.length;i+=3,idx++){
  const base=new THREE.Color(bulbCols[Math.floor(rnd(0,6))]);
  const mat=new THREE.MeshBasicMaterial({color:base.clone()}),b=new THREE.Mesh(bulbGeo,mat);
  b.position.copy(gp2[i]).y-=.05;tree.add(b);
  const g=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:base,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
  g.position.copy(b.position);tree.add(g);
  bulbs.push({mat,g,base,ph:rnd(0,PI2),sp:rnd(.8,2.4),idx,f:i/gp2.length});
}
[[3.2],[5.3],[7.4]].forEach(([y])=>{const l=new THREE.PointLight(0xffaa55,4,8,2);l.position.set(0,y,0);tree.add(l);});

/* ===== ADORNOS COLGANTES ===== */
const bauCols=[0xc41e3a,0xd4af37,0x1e56c8,0xe8e8f0,0x0f8a5f,0xb03090];
const gold=new THREE.MeshStandardMaterial({color:0xffcc33,metalness:1,roughness:.3});
const stringMat=new THREE.MeshStandardMaterial({color:0xd8c9a0,roughness:.6});
const orn=[],bauMeshes=[];
tips.filter(t=>t.y0>1.5&&t.y0<H-1.8&&Math.random()<.36).forEach(t=>{
  const len=rnd(.22,.42),rad=THREE.MathUtils.lerp(.11,.22,Math.min(1,t.rh/R));
  const pivot=new THREE.Group();
  pivot.position.set(t.p.x*1.03,t.p.y+.05,t.p.z*1.03);

/* ===== NIEVE ACUMULADA: cae, se asienta, crece y el viento la va moviendo ===== */
const SNOW_RATE=.0022,SZ=40,SG=90,SW=SZ/SG,W1=SG+1,NV=W1*W1;
const pg=new THREE.PlaneGeometry(SZ,SZ,SG,SG),pa=pg.attributes.position;
const acc=new Float32Array(NV),tA=new Float32Array(NV),pb=new Float32Array(NV),fd=new Float32Array(NV),shl=new Float32Array(NV),hz=new Float32Array(NV),pxs=new Float32Array(NV),pzs=new Float32Array(NV);
const rcan=envR(.6)||3.4;
for(let i=0;i<NV;i++){
  const x=pxs[i]=pa.getX(i),z=pzs[i]=-pa.getY(i),r=Math.hypot(x,z);
  pb[i]=groundH(x,z);
  fd[i]=Math.min(1,Math.max(0,(SZ/2-Math.max(Math.abs(x),Math.abs(z)))/5))*Math.min(1,Math.max(0,(r-1.9)/1.1));
  shl[i]=Math.max(0,r<rcan?(r-1.9)/(rcan-1.9):1)+1.6*Math.exp(-Math.pow(r-rcan-.6,2));
  acc[i]=r>rcan?Math.max(0,.1*Math.sin(x*.5+1)*Math.cos(z*.4)+.04):0;
}
const patch=new THREE.Mesh(pg,new THREE.MeshStandardMaterial({color:0xdde8ff,roughness:.95,polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-1}));
patch.rotation.x=-Math.PI/2;patch.receiveShadow=true;scene.add(patch);
const sat=v=>.9*(1-Math.exp(-v/.9));
function fillSnow(){
  for(let i=0;i<NV;i++){hz[i]=pb[i]+(.05+sat(acc[i]))*fd[i];pa.setZ(i,hz[i]);}
  pa.needsUpdate=true;pg.computeVertexNormals();
}
fillSnow();
function snowH(x,z){
  const fx=(x+SZ/2)/SW,fz=(z+SZ/2)/SW;
  if(fx<0||fz<0||fx>=SG||fz>=SG)return groundH(x,z);
  const ix=fx|0,iz=fz|0,tx=fx-ix,tz=fz-iz,i=iz*W1+ix;
  return (hz[i]*(1-tx)+hz[i+1]*tx)*(1-tz)+(hz[i+W1]*(1-tx)+hz[i+W1+1]*tx)*tz;
}
let snowT=0,sAcc=0,wdx=0,wdz=0,sTick=0;
function snowTick(dt){
  snowT+=dt;sAcc+=dt;wdx+=wind.x*1.2*dt;wdz+=(wind.z*1.2-.05)*dt;
  if(++sTick%6)return;
  for(let i=0;i<NV;i++){   // la nevada cae en manchas que el viento va desplazando
    const x=pxs[i],z=pzs[i],n=Math.sin((x-wdx)*.35+Math.sin(z*.21)*1.4)*Math.sin((z-wdz)*.31+Math.sin(x*.17)*1.2);
    acc[i]+=SNOW_RATE*(.55+.85*(.5+.5*n))*shl[i]*fd[i]*sAcc;
  }
  sAcc=0;tA.set(acc);      // la nieve se asienta (se suaviza)
  for(let iy=1;iy<SG;iy++)for(let ix=1;ix<SG;ix++){const i=iy*W1+ix;acc[i]+=.12*((tA[i-1]+tA[i+1]+tA[i-W1]+tA[i+W1])*.25-tA[i]);}
  fillSnow();
  for(const o of gifts){o.base=snowH(o.group.position.x,o.group.position.z)-o.s*.1;o.group.position.y=o.base+o.y;
    o.sn.scale.y=(.01+.1*(1-Math.exp(-Math.max(0,snowT-o.d)*o.r)))*(.7+.3*o.s);}
  smBase=snowH(smX,smZ);snowman.position.y=smBase-.03+smAnim.y;
  for(const l of lanternGroups)l.lg.position.y=snowH(l.lx,l.lz);
  for(let i=0;i<GN;i++)gPos[i*3+1]=snowH(gPos[i*3],gPos[i*3+2])+.04;
  glintGeo.attributes.position.needsUpdate=true;
  if(sTick%18===0)updCaps(snowT);
}

(()=>{
  const boughGeo=new THREE.DodecahedronGeometry(1,1);

  for(let i=0;i<bp.count;i++){
    const vx=bp.getX(i),vy=bp.getY(i),vz=bp.getZ(i);
    const n=1+.28*Math.sin(vx*4.2+vz*3.1)+.18*Math.cos(vy*5.4);
    bp.setXYZ(i,vx*n,vy*(vy>0?.55:1.05)*n,vz*n);
  }
  boughGeo.computeVertexNormals();

  const NT=52,BPT=12;
  const fTrunks=new THREE.InstancedMesh(new THREE.CylinderGeometry(.14,.32,5.2,7),new THREE.MeshStandardMaterial({color:0x291a10,roughness:.98}),NT);
  const fBoughs=new THREE.InstancedMesh(boughGeo,new THREE.MeshStandardMaterial({roughness:.94,flatShading:true}),NT*BPT);
  const fSnow=new THREE.InstancedMesh(boughGeo,new THREE.MeshStandardMaterial({color:0xd8e4fa,roughness:.92,flatShading:true}),NT*6);

  const m4=new THREE.Object3D(),c4=new THREE.Color();
  let bi=0,si=0,ti=0;
  for(let i=0;i<NT;i++){
    const a=(i/NT)*PI2+rnd(-.07,.07),dist=rnd(38,66),x=Math.cos(a)*dist,z=Math.sin(a)*dist;
    if(Math.hypot(x-cabX,z-cabZ)<9.5)continue;

    m4.position.set(x,y+2.5*sc,z);m4.rotation.set(rnd(-.03,.03),rnd(0,PI2),rnd(-.03,.03));
    m4.scale.set(sc,sc*rnd(.95,1.2),sc);m4.updateMatrix();
    fTrunks.setMatrixAt(ti++,m4.matrix);

    for(let k=0;k<BPT;k++){
      const f=k/(BPT-1),py=y+(2.1+f*6.8)*sc;
      const rad=(2.25*(1-f*.78)+rnd(-.2,.2))*sc;
      const ang=k*2.4+rnd(-.4,.4),off=f<.85?rnd(.1,.38)*rad:0;
      m4.position.set(x+Math.cos(ang)*off,py,z+Math.sin(ang)*off);
      m4.rotation.set(rnd(-.15,.15),rnd(0,PI2),rnd(-.15,.15));
      m4.scale.set(rad,rad*rnd(.45,.68),rad);m4.updateMatrix();
      fBoughs.setMatrixAt(bi,m4.matrix);
      c4.setHSL(rnd(.33,.39),rnd(.26,.42),rnd(.07,.14));

      if(k%2===1&&si<NT*6){
        m4.position.y+=rad*.22;
        m4.scale.set(rad*.78,rad*.22,rad*.78);m4.updateMatrix();
        fSnow.setMatrixAt(si++,m4.matrix);
      }
    }
  }
  fTrunks.count=ti;fTrunks.instanceMatrix.needsUpdate=true;
  fBoughs.count=bi;fBoughs.instanceMatrix.needsUpdate=true;fBoughs.instanceColor.needsUpdate=true;
  fSnow.count=si;fSnow.instanceMatrix.needsUpdate=true;
  scene.add(fTrunks,fBoughs,fSnow);
})();

const GN=550,gPos=new Float32Array(GN*3),gCol=new Float32Array(GN*3),gPh=new Float32Array(GN);
for(let i=0;i<GN;i++){
  const r=rnd(1.8,26),a=rnd(0,PI2),x=Math.cos(a)*r,z=Math.sin(a)*r;
  gPos.set([x,groundH(x,z)+.04,z],i*3);gPh[i]=rnd(0,PI2);
}
const glintGeo=new THREE.BufferGeometry();
glintGeo.setAttribute('position',new THREE.BufferAttribute(gPos,3));
glintGeo.setAttribute('color',new THREE.BufferAttribute(gCol,3));
const glints=new THREE.Points(glintGeo,new THREE.PointsMaterial({size:.18,map:glowTex,vertexColors:true,transparent:true,opacity:.9,depthWrite:false,blending:THREE.AdditiveBlending}));
scene.add(glints);

/* ===== PARTÍCULAS MÁGICAS / CHISPAS INTERACTIVAS ===== */
const MAX_SP=280,spPos=new Float32Array(MAX_SP*3),spVel=new Float32Array(MAX_SP*3),spCol=new Float32Array(MAX_SP*3),spLife=new Float32Array(MAX_SP);
for(let i=0;i<MAX_SP;i++)spPos[i*3+1]=-999;
const spGeo=new THREE.BufferGeometry();
spGeo.setAttribute('position',new THREE.BufferAttribute(spPos,3));
spGeo.setAttribute('color',new THREE.BufferAttribute(spCol,3));
const spPoints=new THREE.Points(spGeo,new THREE.PointsMaterial({size:.32,map:glowTex,vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
spPoints.frustumCulled=false;scene.add(spPoints);
let spCursor=0;
const tmpCol=new THREE.Color();
function spawnSparkles(pos,hex,count=24,speed=2.8){
  tmpCol.setHex(hex);
  for(let i=0;i<count;i++){
    const idx=spCursor;spCursor=(spCursor+1)%MAX_SP;
    const j=idx*3,th=rnd(0,PI2),ph=rnd(0,Math.PI),v=rnd(speed*.35,speed);
    spPos[j]=pos.x+rnd(-.1,.1);spPos[j+1]=pos.y+rnd(-.1,.1);spPos[j+2]=pos.z+rnd(-.1,.1);
    spVel[j]=Math.cos(th)*Math.sin(ph)*v;spVel[j+1]=Math.abs(Math.cos(ph))*v+.6;spVel[j+2]=Math.sin(th)*Math.sin(ph)*v;
    spCol[j]=tmpCol.r;spCol[j+1]=tmpCol.g;spCol[j+2]=tmpCol.b;
    spLife[idx]=rnd(.7,1.3);
  }
}

/* ===== ESTRELLAS DE FONDO ===== */
const kp=new Float32Array(900*3);
for(let i=0;i<900;i++){const r=rnd(70,110),th=rnd(0,PI2),ph=rnd(0,Math.PI*.45);
  kp.set([Math.cos(th)*Math.sin(ph)*r,Math.cos(ph)*r+15,Math.sin(th)*Math.sin(ph)*r],i*3);}
const kg=new THREE.BufferGeometry();kg.setAttribute('position',new THREE.BufferAttribute(kp,3));
const sky=new THREE.Points(kg,new THREE.PointsMaterial({size:.5,map:glowTex,transparent:true,opacity:.85,depthWrite:false,blending:THREE.AdditiveBlending,fog:false}));
scene.add(sky);

/* ===== BOTÓN ÚNICO DE LUCES ===== */
const LIGHT_MODES=[
  {id:'classic',label:'✨ Luces: Clásico'},
  {id:'wave',label:'✨ Luces: Onda'},
  {id:'warm',label:'✨ Luces: Dorado'},
  {id:'aurora',label:'✨ Luces: Aurora'},
  {id:'party',label:'✨ Luces: Fiesta'}
];
let lightModeIdx=0;
const btnLights=document.getElementById('btnLights');
btnLights.addEventListener('click',()=>{
  lightModeIdx=(lightModeIdx+1)%LIGHT_MODES.length;
  btnLights.textContent=LIGHT_MODES[lightModeIdx].label;
});

/* ===== INTERACCIÓN: toca adornos, árbol, regalos, estrella o muñeco ===== */
const tilt={x:0,z:0,vx:0,vz:0},rc=new THREE.Raycaster(),mp=new THREE.Vector2(),tmp=new THREE.Vector3();
let down=null,magicTimer=0;
const interactables=[...bauMeshes,core,star,...giftMeshes,...snowmanMeshes];
addEventListener('pointermove',e=>{
  if(e.target===btnLights)return;
  mp.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);rc.setFromCamera(mp,camera);
  const hit=rc.intersectObjects(interactables,false)[0];
  renderer.domElement.style.cursor=hit?'pointer':'grab';
});
addEventListener('pointerdown',e=>{
  if(e.target===btnLights){down=null;return;}
  down=[e.clientX,e.clientY];
});
addEventListener('pointerup',e=>{
  if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>8)return;
  mp.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);rc.setFromCamera(mp,camera);
  const h=rc.intersectObjects(interactables,false)[0];if(!h)return;
  if(h.object===star){
    spawnSparkles(star.getWorldPosition(tmp),0xffdd55,36,3.8);
    magicTimer=1.2;return;
  }
  if(h.object.userData.gift){
    const g=h.object.userData.gift;
    g.vy=3.8;g.spin=rnd(-6,6);
    spawnSparkles(h.point,g.color,26,2.8);return;
  }
  if(snowmanMeshes.includes(h.object)){
    smAnim.vy=3.2;smAnim.vt=rnd(-3,3);
    spawnSparkles(h.point,0xddeeff,24,2.4);return;
  }
  const dir=h.point.clone().sub(camera.position).setY(0).normalize();
  orn.forEach(o=>{const d=o.pivot.getWorldPosition(tmp).distanceTo(h.point);
    if(d<2.4){const f=1-d/2.4;o.vx+=dir.x*f*3.5;o.vz+=dir.z*f*3.5;}});
  tilt.vz-=dir.x*.22;tilt.vx+=dir.z*.22;
  spawnSparkles(h.point,h.object.userData.color||0xffdd66,22,2.6);
});

/* ===== ANIMACIÓN ===== */
const clock=new THREE.Clock(),wind={x:0,z:0};
const warmC=new THREE.Color(0xffbe55),aurC1=new THREE.Color(0x22ffaa),aurC2=new THREE.Color(0x5588ff),tmpBulbC=new THREE.Color();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.033),t=clock.elapsedTime;
  wind.x=(Math.sin(t*.4)+Math.sin(t*1.3+2)*.5+Math.sin(t*.13)*.8)*.5+.3;
  wind.z=(Math.sin(t*.31+1)+Math.sin(t*.9)*.4)*.4;

  auroraUniforms.uTime.value=t;

  const mode=LIGHT_MODES[lightModeIdx].id;
  for(const b of bulbs){
    let tw,col=b.base;
    if(mode==='classic')tw=.5+.5*Math.sin(t*b.sp*3+b.ph);
    else if(mode==='wave')tw=.5+.5*Math.sin(t*4.5-b.f*18);
    else if(mode==='warm'){col=warmC;tw=.65+.35*Math.sin(t*2.2+b.ph);}
    else if(mode==='aurora'){col=tmpBulbC.copy(aurC1).lerp(aurC2,.5+.5*Math.sin(t*.9+b.f*8));tw=.45+.55*Math.sin(t*2.8+b.ph);}
    else tw=((Math.floor(t*7)+b.idx)%4===0)?1:.12;

    b.mat.color.copy(col).multiplyScalar(.35+tw*1.1);
    b.g.material.color.copy(col);
    b.g.material.opacity=.3+tw*.7;const s=.5+tw*.5;b.g.scale.set(s,s,1);
  }

  star.rotation.y=t*.7;star.rotation.z=Math.sin(t*1.3)*.08;const pl=1+Math.sin(t*2)*.1+(magicTimer>0?.25:0);
  starGlow.scale.set(5*pl,5*pl,1);starFlare.scale.set(3.2*pl,3.2*pl,1);
  starFlare.material.rotation=t*.25;
  starLight.intensity=3+Math.sin(t*2)*.8+(magicTimer>0?2:0);

  if(magicTimer>0){
    magicTimer=Math.max(0,magicTimer-dt);
    const f=1-magicTimer/1.2,ang=f*PI2*4,ry=Y0+f*(H-Y0+.3),rr=prof(Math.min(ry,H))+.25;
    tmp.set(Math.cos(ang)*rr,ry,Math.sin(ang)*rr);
    spawnSparkles(tmp,Math.random()<.5?0xffdd55:0x88eeff,3,1.5);
  }

  for(const l of lanternSprites){const f=1+Math.sin(t*5+l.ph)*.08;l.sp.scale.set(1.6*f,1.6*f,1);}

  for(let i=0;i<SMK;i++){
    const j=i*3;smkAge[i]+=dt*.16;
    if(smkAge[i]>=1){
      smkAge[i]=0;
      smkPos[j]=chimWorld.x+rnd(-.15,.15);smkPos[j+1]=chimWorld.y;smkPos[j+2]=chimWorld.z+rnd(-.15,.15);
    }else{
      smkPos[j]+=(wind.x*.75+Math.sin(t+i)*.12)*dt;
      smkPos[j+1]+=1.15*dt;
      smkPos[j+2]+=(wind.z*.75+Math.cos(t+i)*.12)*dt;
    }
  }
  smkGeo.attributes.position.needsUpdate=true;

  tilt.vz+=(-14*tilt.z-2.4*tilt.vz-wind.x*.12)*dt;tilt.vx+=(-14*tilt.x-2.4*tilt.vx+wind.z*.12)*dt;
  tilt.z+=tilt.vz*dt;tilt.x+=tilt.vx*dt;tree.rotation.set(tilt.x,0,tilt.z);

  const G=7;
  for(const o of orn){
    o.vx+=(-G/o.len*Math.sin(o.tx)-1.1*o.vx+wind.x*.9/o.len*.3-tilt.vz*6*dt*60*.02)*dt;
    o.vz+=(-G/o.len*Math.sin(o.tz)-1.1*o.vz+wind.z*.9/o.len*.3+tilt.vx*6*dt*60*.02)*dt;
    o.tx+=o.vx*dt;o.tz+=o.vz*dt;
    o.pivot.rotation.z=o.tx;o.pivot.rotation.x=-o.tz;
  }

  for(const g of gifts){
    if(g.y>0||Math.abs(g.vy)>.01||Math.abs(g.spin)>.01){
      g.vy-=16*dt;g.y+=g.vy*dt;
      if(g.y<0){g.y=0;g.vy=-g.vy*.35;if(Math.abs(g.vy)<.2)g.vy=0;}
      g.group.position.y=g.base+g.y;g.group.rotation.y+=g.spin*dt;g.spin*=.92;
    }
  }
  if(smAnim.y>0||Math.abs(smAnim.vy)>.01||Math.abs(smAnim.tilt)>.005||Math.abs(smAnim.vt)>.01){
    smAnim.vy-=15*dt;smAnim.y+=smAnim.vy*dt;
    if(smAnim.y<0){smAnim.y=0;smAnim.vy=-smAnim.vy*.3;if(Math.abs(smAnim.vy)<.15)smAnim.vy=0;}
    smAnim.vt+=(-22*smAnim.tilt-4*smAnim.vt)*dt;smAnim.tilt+=smAnim.vt*dt;
    snowman.position.y=smBase-.03+smAnim.y;
    snowman.rotation.z=smAnim.tilt*.12;
  }else snowman.rotation.z=Math.sin(t*1.2)*.015;

  const k=Math.min(1,dt*1.8);
  for(let i=0;i<SN;i++){
    const j=i*3,ph=sph[i];
    svel[j]  +=(wind.x*1.6+Math.sin(t*1.1+ph)*.35-svel[j])*k;
    svel[j+1]+=(-sterm[i]-svel[j+1])*k;
    svel[j+2]+=(wind.z*1.6+Math.cos(t*.9+ph*1.3)*.35-svel[j+2])*k;
    spos[j]+=svel[j]*dt;spos[j+1]+=svel[j+1]*dt;spos[j+2]+=svel[j+2]*dt;
    let x=spos[j],y=spos[j+1],z=spos[j+2],reset=y<0||Math.abs(x)>42||Math.abs(z)>42;
    if(!reset){
      const er=envR(y);
      if(er>0){const r=Math.hypot(x,z);
        if(r<er&&r>.001){if(Math.random()<.4)reset=true;else{const o=er+rnd(.05,.35);spos[j]=x*o/r;spos[j+2]=z*o/r;svel[j]=x/r*1.2;svel[j+2]=z/r*1.2;}
          }}
    }
    if(reset){spos[j]=rnd(-40,40);spos[j+1]=rnd(33,40);spos[j+2]=rnd(-40,40);}
  }
  snowGeo.attributes.position.needsUpdate=true;snowTick(dt);

  for(let i=0;i<FN;i++){
    const j=i*3,ph=fph[i];
    fpos[j]+=(wind.x*1.1+Math.sin(t*.9+ph)*.5)*dt;
    fpos[j+1]-=.75*dt;
    fpos[j+2]+=(wind.z*1.1+Math.cos(t*.8+ph)*.5)*dt;
    if(fpos[j+1]<0||Math.abs(fpos[j])>25||Math.abs(fpos[j+2])>25){
      fpos[j]=rnd(-24,24);fpos[j+1]=rnd(19,24);fpos[j+2]=rnd(-24,24);
    }
  }
  flakeGeo.attributes.position.needsUpdate=true;

  for(let i=0;i<GN;i++){
    const v=Math.pow(.5+.5*Math.sin(t*2.6+gPh[i]),10),j=i*3;
    gCol[j]=v*.85;gCol[j+1]=v*.92;gCol[j+2]=v;
  }
  glintGeo.attributes.color.needsUpdate=true;

  let spChanged=false;
  for(let i=0;i<MAX_SP;i++){
    if(spLife[i]>0){
      spChanged=true;const j=i*3;
      spLife[i]-=dt;spVel[j+1]-=3.2*dt;
      spPos[j]+=spVel[j]*dt;spPos[j+1]+=spVel[j+1]*dt;spPos[j+2]+=spVel[j+2]*dt;
      spCol[j]*=.97;spCol[j+1]*=.97;spCol[j+2]*=.97;
      if(spLife[i]<=0||spPos[j+1]<0){spLife[i]=0;spPos[j+1]=-999;}
    }
  }
  if(spChanged){spGeo.attributes.position.needsUpdate=true;spGeo.attributes.color.needsUpdate=true;}

  sky.rotation.y=t*.005;
  controls.update();
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{
  camera.fov=getFov();
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
setTimeout(()=>{const h=document.getElementById('hint');if(h)h.style.opacity='0';},7000);
animate();
})();
</script>
</body>
</html>
